    <style>
      /* Primer pintado sin esperar el bundle: mismo fondo y misma marca. */
      html { background: #f5f6f1; }
      body { margin: 0; font-family: 'Manrope', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      #inicio-pantalla {
        position: fixed; inset: 0; display: grid; place-items: center;
        background:
          radial-gradient(1200px 600px at 85% -10%, rgba(47, 158, 99, .10), transparent 60%),
          radial-gradient(900px 500px at -10% 110%, rgba(185, 138, 31, .07), transparent 55%),
          #f5f6f1;
      }
      #inicio-pantalla .caja { display: grid; gap: 14px; justify-items: center; }
      #inicio-pantalla .marca {
        width: 52px; height: 52px; border-radius: 15px; display: grid; place-items: center;
        background: linear-gradient(145deg, #2f9e63, #14532d); color: #fff;
        font-weight: 800; font-size: 23px; letter-spacing: -.04em;
        box-shadow: 0 10px 26px -12px rgba(20, 83, 45, .85);
      }
      #inicio-pantalla .nombre { font-size: 15px; font-weight: 750; color: #0f1714; letter-spacing: -.02em; }
      #inicio-pantalla .nota { font-size: 13px; color: #5f6e66; }
      .sin-js { max-width: 420px; margin: 48px auto; padding: 24px; font-size: 14px; line-height: 1.5; color: #2b3a33; text-align: center; }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="inicio-pantalla">
        <div class="caja">
          <div class="marca" aria-hidden="true">A</div>
          <span class="nombre">Ares</span>
          <span class="nota">Preparando tu panel…</span>
        </div>
      </div>
    </div>
    <noscript>
      <div class="sin-js">
        <p><strong>Ares necesita JavaScript.</strong></p>
        <p>Actívalo en tu navegador y vuelve a cargar esta página.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
