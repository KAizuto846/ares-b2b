<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; background: #0d2018; font-family: system-ui, sans-serif; color: #cfe0d5; padding: 28px; }
  h2 { font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #7f9889; margin: 26px 0 10px; }
  .fila { display: flex; align-items: flex-end; gap: 22px; }
  .caja { display: grid; gap: 6px; justify-items: center; }
  .caja span { font-size: 11px; color: #6f8a7c; }
  .marca { display: grid; place-items: center; background: linear-gradient(145deg, #2f9e63, #14532d); border-radius: 10px; box-shadow: 0 6px 18px -8px rgba(47,158,99,.9); }
  .claro { background: #f5f6f1; border-radius: 14px; padding: 18px; display: flex; gap: 18px; align-items: center; }
  .claro .marca { background: #14532d; }
  .claro .oscuro { background: #0d2018; }
  svg { display: block; }
</style>
</head>
<body>

<h2>1 · Lanza y penacho</h2>
<div class="fila" id="v1"></div>

<h2>2 · Yelmo (visor y cresta)</h2>
<div class="fila" id="v2"></div>

<h2>3 · A con lanza vertical</h2>
<div class="fila" id="v3"></div>

<h2>4 · Escudo en el contramuro</h2>
<div class="fila" id="v4"></div>

<h2>Sobre fondo claro y oscuro (32 px)</h2>
<div class="claro" id="claro"></div>

<script>
const S = (inner, vb = '0 0 32 32') => `<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`

const v1 = S(`
  <g fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 27 16 7l8 20"/>
    <path d="M3.2 19.2h24.2"/>
  </g>
  <path d="M27.4 16.2 31 19.2l-3.6 3z" fill="#fff"/>
  <path d="M16 7c-1-2.4-3-4-5.6-4.6M16 7c0-2.6 1-4.6 2.6-6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
`)

const v2 = S(`
  <g fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 27 16 7l8 20"/>
    <path d="M10.6 19.6h10.8"/>
    <path d="M16 19.6v3.6"/>
  </g>
  <path d="M16 7c-1.6-2.6-4.4-3.6-7.4-3.2 1.6 2.2 3.6 3.6 5.8 4.4" fill="#fff"/>
`)

const v3 = S(`
  <g fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 27 16 8.6l8 18.4"/>
    <path d="M10.6 19.6h10.8"/>
    <path d="M16 8.6V2.4"/>
  </g>
  <path d="M16 1.2 18.6 4.4 16 7.4 13.4 4.4z" fill="#fff"/>
`)

const v4 = S(`
  <path d="M5.6 27.4 16 5.4l10.4 22z" fill="#fff"/>
  <path d="M16 12.4c1.9 1.2 2.9 2.7 2.9 4.6 0 2.6-1.5 4.6-2.9 5.6-1.4-1-2.9-3-2.9-5.6 0-1.9 1-3.4 2.9-4.6z" fill="#14532d"/>
`)

const tam = [16, 24, 32, 48, 96]
for (const [id, svg] of [['v1', v1], ['v2', v2], ['v3', v3], ['v4', v4]]) {
  const cont = document.getElementById(id)
  for (const t of tam) {
    const c = document.createElement('div'); c.className = 'caja'
    const m = document.createElement('div'); m.className = 'marca'
    m.style.width = m.style.height = t + 'px'
    m.style.borderRadius = Math.max(4, Math.round(t * 0.28)) + 'px'
    m.innerHTML = svg
    const s = m.querySelector('svg'); s.setAttribute('width', t * 0.72); s.setAttribute('height', t * 0.72)
    const l = document.createElement('span'); l.textContent = t + 'px'
    c.append(m, l); cont.append(c)
  }
}

const claro = document.getElementById('claro')
for (const [bg, svg] of [['claro', v1], ['oscuro', v1]]) {
  const m = document.createElement('div'); m.className = 'marca ' + bg
  m.style.width = m.style.height = '64px'; m.style.borderRadius = '18px'
  m.innerHTML = svg
  const s = m.querySelector('svg'); s.setAttribute('width', 46); s.setAttribute('height', 46)
  claro.append(m)
}
</script>
</body>
</html>
